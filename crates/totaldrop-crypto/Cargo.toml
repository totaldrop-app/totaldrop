[package]
name = "totaldrop-crypto"
description = "Cryptographic building blocks of the TotalDrop protocol (suite TD0)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
curve25519-dalek = "5.0.0"
ed25519-dalek = "3.0.0"
ml-kem = { version = "0.3.3", features = ["getrandom"] }
sha2 = "0.11.1"
getrandom = "0.4.3"
zeroize = { version = "1.9.1", features = ["derive"] }

[lints]
workspace = true
