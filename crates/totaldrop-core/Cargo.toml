[package]
name = "totaldrop-core"
description = "TotalDrop client engine: rendezvous, secure handshake and file transfer"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
blake3 = "1.8.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "std"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
totaldrop-crypto = { version = "0.1.0-beta.1", path = "../totaldrop-crypto" }
totaldrop-proto = { version = "0.1.0-beta.1", path = "../totaldrop-proto" }
webpki-roots = "1"
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true
