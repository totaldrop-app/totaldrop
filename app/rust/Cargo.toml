[package]
name = "rust_lib_totaldrop"
description = "Bridge between the TotalDrop Flutter app and totaldrop-core"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
totaldrop-core = { version = "0.2.0-beta.1", path = "../../crates/totaldrop-core" }
totaldrop-proto = { version = "0.2.0-beta.1", path = "../../crates/totaldrop-proto" }
totaldrop-l10n = { version = "0.2.0-beta.1", path = "../../crates/totaldrop-l10n" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
