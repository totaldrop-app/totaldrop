[package]
name = "totaldrop-relay"
description = "TotalDrop relay: address discovery and forwarding of encrypted QUIC datagrams"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
ring = "0.17.14"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
totaldrop-proto = { version = "0.1.0-beta.1", path = "../../crates/totaldrop-proto" }

[dev-dependencies]
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true
