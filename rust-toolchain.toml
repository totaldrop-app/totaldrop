[toolchain]
# Always the newest stable Rust. Dependabot cannot bump this file, so update
# it with every stable release (every six weeks).
channel = "1.99.1"
components = ["clippy", "rustfmt"]
# Android targets for the app; desktop builds ignore them.
targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
profile = "minimal"
