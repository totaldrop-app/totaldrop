# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained, not vulnerable: zbus 6 absorbed these crates. They reach us
# only through ashpd (Linux app, desktop portals), whose newest release
# (0.13) still uses zbus 5. Remove these once ashpd moves to zbus 6, or
# when the Linux app talks to the portals through zbus 6 directly.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; via ashpd 0.13 only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; via ashpd 0.13 only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; via ashpd 0.13 only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # curve25519-dalek, ed25519-dalek, subtle: permissive, GPL/AGPL compatible.
    "BSD-3-Clause",
    # ring, untrusted, rustls-webpki: permissive, GPL/AGPL compatible.
    "ISC",
    # webpki-roots (the Mozilla root list as data): permissive, compatible.
    "CDLA-Permissive-2.0",
]
# Add a license here only after checking that it is compatible with every
# license in LICENSING.md, and say why in the pull request.
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "totaldrop-cli" },
    { allow = ["AGPL-3.0-or-later"], crate = "totaldrop-rendezvous" },
    { allow = ["AGPL-3.0-or-later"], crate = "totaldrop-relay" },
    { allow = ["GPL-3.0-or-later"], crate = "rust_lib_totaldrop" },
    { allow = ["GPL-3.0-or-later"], crate = "totaldrop-linux" },
    # Through dirs, only in the Linux app (GPL-3.0-or-later). MPL-2.0 is
    # file-level copyleft and compatible with the GPL; it never reaches the
    # MIT/Apache protocol crates.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
