# Copyright and license of the files that cannot carry them in a comment
# (images, JSON, translations, documents) or that are generated or copied.
# Source files carry their own SPDX lines; the REUSE tool checks both
# (`reuse lint`, in CI). Licenses by directory: LICENSING.md.
version = 1

# Everything not listed below: the apps' license.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The protocol libraries and their fuzz targets.
[[annotations]]
path = [
  "crates/totaldrop-crypto/**",
  "crates/totaldrop-proto/**",
  "crates/totaldrop-core/**",
  "crates/totaldrop-l10n/**",
  "fuzz/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "server/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated: Flutter's localizations and the flutter_rust_bridge glue. They
# take the license of the app they are generated for.
[[annotations]]
path = [
  "app/lib/l10n/**",
  "app/lib/src/rust/**",
  "app/rust/src/frb_generated.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Cargokit, copied from flutter_rust_bridge's template (see its LICENSE).
[[annotations]]
path = "app/rust_builder/cargokit/**"
precedence = "override"
SPDX-FileCopyrightText = "2022 Matej Knopp"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The fonts, under their own license (their texts sit next to them).
[[annotations]]
path = [
  "app/assets/fonts/Atkinson*",
  "app/assets/fonts/OFL-AtkinsonHyperlegible.txt",
  "site/public/fonts/atkinson-*",
  "site/public/fonts/LICENSE-atkinson-hyperlegible.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "app/assets/fonts/Bricolage*",
  "app/assets/fonts/OFL-BricolageGrotesque.txt",
  "site/public/fonts/bricolage-*",
  "site/public/fonts/LICENSE-bricolage-grotesque.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Bricolage Grotesque Project Authors"
SPDX-License-Identifier = "OFL-1.1"
