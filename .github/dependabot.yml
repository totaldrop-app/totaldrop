version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /server/rendezvous-worker
      - /server/relay-worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /packaging/containers
    schedule:
      interval: weekly
  # Actions are pinned to commit SHAs (threat model T11); Dependabot keeps
  # the SHA and the version comment current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
