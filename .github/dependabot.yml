version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /server/rendezvous-worker
      - /server/relay-worker
    schedule:
      interval: weekly
  # Base images are pinned by digest; Dependabot bumps the digests. A new
  # major version (fedora:44) changes the oldest supported system, so it is
  # a decision, not an update.
  - package-ecosystem: docker
    directory: /packaging/containers
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Actions are pinned to commit SHAs (threat model T11); Dependabot keeps
  # the SHA and the version comment current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
