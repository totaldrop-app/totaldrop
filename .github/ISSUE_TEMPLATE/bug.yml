name: Bug
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, Android, Windows, macOS, iOS, CLI, Web site, Server]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings > About, or `totaldrop --version`.
      placeholder: e.g. 0.3.0-beta.1 (app), totaldrop --version for the CLI
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and desktop (for example Arch + Hyprland, Fedora + Plasma), or the device and its Android version.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: details
    attributes:
      label: Details
      description: The "Details" text from the error screen. Do not share transfer codes or file names.
      render: text
