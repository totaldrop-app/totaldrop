name: Feature request
description: Suggest a feature or an improvement.
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [All, Linux, Android, Windows, macOS, iOS, CLI, Web site, Server, Protocol]
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What need does it meet?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
