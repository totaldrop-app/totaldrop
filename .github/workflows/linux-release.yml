# Linux release: from a `linux-v*` tag, the Linux checks and the three
# packages a PR runs, then a draft GitHub release with checksums and
# build provenance (docs/surec.md).
name: Linux release

on:
  push:
    tags: ["linux-v*"]

permissions:
  contents: read

jobs:
  tag:
    name: Tag matches and is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Versions agree with the tag
        run: packaging/check-versions.sh "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  verify:
    name: Checks and packages
    needs: tag
    uses: ./.github/workflows/linux.yml

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement that these files were built
      # here, from this tag, by this workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      # GitHub turns "~" in asset names into "."; rename first so the
      # checksums list the names people download.
      - name: Names and checksums
        working-directory: packages
        run: |
          for f in *~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done
          sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "packages/*.pkg.tar.zst, packages/*.deb, packages/*.rpm"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "TotalDrop for Linux ${TAG#linux-v}"
