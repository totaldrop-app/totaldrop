# Web site (totaldrop.app): checks on every change. Deploys stay manual
# (wrangler pages deploy) until deploy keys live in CI.
name: Site

on:
  push:
    branches: [main]
    paths: &paths
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Scripts and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Scripts parse
        run: node --check site/public/app.js && node --check site/functions/_middleware.js
      - name: Every page links only to files that exist
        working-directory: site/public
        run: |
          status=0
          for page in index.html download/index.html r/index.html privacy.html; do
            for ref in $(grep -oE '(href|src)="/[^"#]*"' "$page" | sed -E 's/.*="\/([^"]*)"/\1/'); do
              [ -z "$ref" ] && continue
              [ -e "$ref" ] || [ -e "$ref/index.html" ] || [ -e "$ref.html" ] || { echo "$page → /$ref missing"; status=1; }
            done
          done
          exit $status
