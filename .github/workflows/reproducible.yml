# Reproducible builds: each Linux package is built twice, from two clean
# checkouts of the same commit, minutes apart, and the two must be byte for
# byte the same (OpenSSF Best Practices build_reproducible, #252). Inside
# the build container the paths are always the same (build.sh mounts the
# work folder at /w), so this checks timestamps, ordering and the build
# environment, not path independence. packaging/compare-packages.sh compares
# them; one known difference, the order cxx-qt links the Qt libraries (#256),
# is only a warning. When they differ otherwise, both builds are uploaded for
# diffoscope. Only x86_64 is built here; the arm64 packages come from the
# same scripts.
name: Reproducible

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "linux/build.rs"
      - "linux/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/reproducible.yml"

permissions:
  contents: read

concurrency:
  group: reproducible-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Twice (${{ matrix.format }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        format: [arch, deb, rpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: second/elsewhere
          fetch-depth: 1
          persist-credentials: false
      # One timestamp for both builds: without it each build would take its own.
      - name: Timestamp
        run: |
          t=$(git -C first log -1 --format=%ct)
          test -n "$t"
          echo "SOURCE_DATE_EPOCH=$t" >> "$GITHUB_ENV"
      - name: First build
        run: |
          first/packaging/build.sh ${{ matrix.format }}
          # Only the packages are compared; the build tree would fill the disk.
          rm -rf first/dist/work-*
      - name: Second build
        run: second/elsewhere/packaging/build.sh ${{ matrix.format }}
      - name: Compare
        run: |
          command -v bsdtar >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools; }
          first/packaging/compare-packages.sh first/dist/packages second/elsewhere/dist/packages
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: not-reproducible-${{ matrix.format }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            first/dist/packages/*
            second/elsewhere/dist/packages/*
