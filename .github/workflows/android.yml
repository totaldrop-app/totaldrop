# Android app: analysis and tests on every change to it, and the signed
# Play bundle from an `android-v*` tag. Only bundles built here are uploaded
# to Google Play.
name: Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths: &paths
      - "app/**"
      - "crates/totaldrop-core/**"
      - "crates/totaldrop-crypto/**"
      - "crates/totaldrop-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; else echo "no tests yet"; fi

  build:
    name: Debug build (arm64)
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      # rustup reads rust-toolchain.toml, which lists the Android targets.
      - name: Rust toolchain and Android targets
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64

  release:
    name: Signed Play bundle
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: play-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Rust toolchain and Android targets
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      # The version must match the tag, and the build number (versionCode)
      # must be higher than the last release's: Google Play refuses reuse.
      - name: Version and build number
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#android-v}"
          have=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          code=$(sed -n 's/^version: [^+]*+\([0-9]*\).*/\1/p' pubspec.yaml)
          [ "$want" = "$have" ] || { echo "tag $want, pubspec $have"; exit 1; }
          prev=$(git describe --tags --abbrev=0 --match 'android-v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            old=$(git show "$prev:app/pubspec.yaml" | sed -n 's/^version: [^+]*+\([0-9]*\).*/\1/p')
            [ "$code" -gt "$old" ] || { echo "build number $code is not above $old ($prev)"; exit 1; }
          fi
      - run: flutter pub get --enforce-lockfile
      # The upload key lives only in this environment's secrets and reaches
      # Gradle through environment variables, so the password never touches
      # disk. Without the key the build fails instead of using the debug key.
      - name: Build the signed bundle
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          TOTALDROP_REQUIRE_RELEASE_KEY: "1"
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$ANDROID_UPLOAD_PASSWORD" ] || { echo "upload key secrets missing"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks" flutter build appbundle --release
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Signed with the upload key
        env:
          # SHA-256 of the upload certificate registered with Google Play.
          EXPECTED: "42:65:75:4D:25:74:3A:5A:EA:AC:CA:92:4F:03:6A:DB:F3:77:9E:95:FB:6A:B9:87:17:50:59:3C:9C:7F:B0:FB"
        run: |
          got=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | sed -n 's/^\s*SHA256: //p' | head -1)
          [ "$got" = "$EXPECTED" ] || { echo "signed with $got"; exit 1; }
      - name: Name the bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist
          cp build/app/outputs/bundle/release/app-release.aab "../dist/TotalDrop-${TAG#android-v}.aab"
          (cd ../dist && sha256sum *.aab > SHA256SUMS)
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: dist/
          retention-days: 30

# Before the first public release, pin every action above to a full commit SHA.
