# Android app: analysis, tests and a debug build. The signed Play bundle
# is built by android-release.yml from an `android-v*` tag.
name: Android

# Runs from ci.yml when its files change (see the area filters there), from
# the release workflow on a tag, or by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; else echo "no tests yet"; fi

  build:
    name: Debug build (arm64)
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      # rustup reads rust-toolchain.toml, which lists the Android targets.
      - name: Rust toolchain and Android targets
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-arm64
