# Rendezvous server and relay on Cloudflare Workers: type check.
# Deploys stay manual (wrangler deploy) until deploy keys live in CI.
name: Server

# Runs from ci.yml when its files change (see the area filters there), or
# by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [rendezvous-worker, relay-worker]
    defaults:
      run:
        working-directory: server/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check
