# Android release: from an `android-v*` tag, the Android checks a PR runs,
# then the Play bundle signed with the upload key. Only bundles built here
# are uploaded to Google Play (docs/surec.md).
name: Android release

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  tag:
    name: Tag matches and is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Versions, build number and main ancestry agree with the tag
        run: node tools/version.mjs check --tag "$GITHUB_REF_NAME"

  verify:
    name: Checks
    needs: tag
    uses: ./.github/workflows/android.yml

  release:
    name: Signed Play bundle
    needs: verify
    runs-on: ubuntu-latest
    environment: play-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # The signed bundle is built with a known Flutter, not the day's.
          flutter-version: 3.47.8
      - name: Rust toolchain and Android targets
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      # Defense in depth inside play-release: verify the tag and monotonic
      # versionCode across all merged android-v* tags before signing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Version and build number
        working-directory: .
        run: node tools/version.mjs check --tag "$GITHUB_REF_NAME"
      - run: flutter pub get --enforce-lockfile
      # The upload key lives only in this environment's secrets and reaches
      # Gradle through environment variables, so the password never touches
      # disk. Without the key the build fails instead of using the debug key.
      - name: Build the signed bundle
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          TOTALDROP_REQUIRE_RELEASE_KEY: "1"
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$ANDROID_UPLOAD_PASSWORD" ] || { echo "upload key secrets missing"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks" flutter build appbundle --release --dart-define="TOTALDROP_VERSION=${TAG#android-v}"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Signed with the upload key
        env:
          # SHA-256 of the upload certificate registered with Google Play.
          EXPECTED: "42:65:75:4D:25:74:3A:5A:EA:AC:CA:92:4F:03:6A:DB:F3:77:9E:95:FB:6A:B9:87:17:50:59:3C:9C:7F:B0:FB"
        run: |
          got=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | sed -n 's/^\s*SHA256: //p' | head -1)
          [ "$got" = "$EXPECTED" ] || { echo "signed with $got"; exit 1; }
      - name: Name the bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist
          cp build/app/outputs/bundle/release/app-release.aab "../dist/TotalDrop-${TAG#android-v}.aab"
          (cd ../dist && sha256sum -- *.aab > SHA256SUMS)
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: dist/
          retention-days: 30
