# Checks that the live Cloudflare zone rate-limiting rule for
# relay.totaldrop.app still matches server/relay-worker/README.md (#526).
# A dashboard edit or deletion pushes no commit; the daily run picks it up
# through Cloudflare's read-only Rulesets API without sending burst traffic
# to relay.totaldrop.app.
name: Relay rate limit

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare live rule with README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test the drift check tool
        run: node --test server/tools/test-relay-ratelimit.mjs
      - name: Compare against the live Cloudflare zone ruleset
        env:
          CLOUDFLARE_WAF_READ_TOKEN: ${{ secrets.CLOUDFLARE_WAF_READ_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node server/tools/check-relay-ratelimit.mjs --live
