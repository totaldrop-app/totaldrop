# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned
# actions, least-privilege tokens, branch protection, signed releases, ...)
# and publishes the result to scorecard.dev and the Security tab. The
# README badge reads the published result. Runs on main only: publishing
# needs the default branch, and a pull request cannot change the score.
name: Scorecard

on:
  push:
    branches: [main]
  # A settings change (rulesets, security features) pushes no commit; the
  # weekly run picks it up. With the default GITHUB_TOKEN, Scorecard reads
  # rulesets but not classic branch protection.
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload the SARIF result to the Security tab.
      security-events: write
      # Sign the published result, so scorecard.dev can tell it came from
      # this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
