# The one workflow every pull request and every push to main runs. It works
# out which areas changed and runs only their workflows; the final "CI" job
# is the single required check on main, and passes only when every workflow
# that ran passed. A change to CI itself runs everything.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Not used yet; here so the required check also reports if a merge queue
  # is turned on.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.areas.outputs.core }}
      android: ${{ steps.areas.outputs.android }}
      linux: ${{ steps.areas.outputs.linux }}
      server: ${{ steps.areas.outputs.server }}
      site: ${{ steps.areas.outputs.site }}
      formal: ${{ steps.areas.outputs.formal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          shared='Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$'
          declare -A area=(
            [core]="^(crates/|l10n/|server/totaldrop-(rendezvous|relay)/|fuzz/|deny\.toml$|$shared|\.github/workflows/core\.yml$)"
            [android]="^(app/|l10n/|crates/totaldrop-(core|crypto|proto|l10n)/|$shared|\.github/workflows/android(-release)?\.yml$)"
            [linux]="^(linux/|packaging/|tools/(test-)?(flatpak-cargo-sources|desktop-entries)\.mjs$|l10n/|crates/totaldrop-(core|crypto|proto|cli|l10n)/|$shared|\.github/workflows/linux(-release)?\.yml$)"
            [server]="^(server/(rendezvous|relay)-worker/|server/tools/|server/totaldrop-(rendezvous|relay)/|crates/totaldrop-(core|crypto|proto|cli|l10n)/|l10n/|$shared|\.github/workflows/server\.yml$)"
            [formal]="^(formal/|\.github/workflows/formal\.yml$)"
            [site]="^(site/|app/assets/logo\.svg$|l10n/tests/|[^/]+\.md$|docs/|packaging/linux/app\.totaldrop\.TotalDrop\.svg$|\.github/workflows/site\.yml$)"
          )
          # Every changed path, unquoted (non-ASCII names stay as they are)
          # and with both sides of a rename, so moving a file out of an area
          # still runs that area. Run everything on a manual run, when the
          # base commit is unknown or missing, or when CI itself changed.
          if [ "$EVENT" = workflow_dispatch ] || ! files=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE...$HEAD" 2>/dev/null); then
            all=true
          elif grep -qE '^(\.github/workflows/ci\.yml|\.github/actions/)' <<<"$files"; then
            all=true
          else
            all=false
          fi
          printf 'Changed files:\n%s\n' "${files:-(unknown)}"
          for name in "${!area[@]}"; do
            if [ "$all" = true ]; then
              v=true
            else
              # grep exits 2 on a broken pattern; fail rather than skip.
              rc=0; grep -qE "${area[$name]}" <<<"$files" || rc=$?
              case $rc in 0) v=true ;; 1) v=false ;; *) echo "bad pattern for $name"; exit 1 ;; esac
            fi
            echo "$name=$v" | tee -a "$GITHUB_OUTPUT"
          done

  core:
    name: Core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core.yml
  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/linux.yml
  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml
  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml
  formal:
    name: Formal
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    uses: ./.github/workflows/formal.yml

  # Every change records itself in changelog.d/ (docs/surec.md). Runs on
  # every pull request and push, whatever changed; it takes seconds.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: The changelog tool works
        run: node --test tools/test-changelog.mjs
      - name: Entries follow the rules
        run: node tools/changelog.mjs check
      # Dependabot's updates are recorded by the release that ships them.
      # On a pull request the checkout is the merge commit; its first parent
      # is main as it is now, so only the pull request's own files count.
      - name: The pull request records its change
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node tools/changelog.mjs require HEAD^1 HEAD

  # Each component has its own version (docs/versioning.md); the servers
  # and app/rust must not drift back to the workspace version. Cheap, so it
  # runs on every change.
  versions:
    name: Component versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/check-component-versions.sh

  # cargo-deny and OSV-Scanner (OpenSSF Scorecard) ignore the same
  # advisories. Cheap, so it runs on every change.
  advisories:
    name: Advisory ignores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/test-advisory-ignores.sh
      - run: tools/check-advisory-ignores.sh

  # Every file carries its copyright and license, in its own SPDX lines or
  # in REUSE.toml (REUSE 3.3, #249), and every source file in its own lines.
  # Cheap, so it runs on every change.
  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: tools/check-spdx.sh
      # The REUSE tool's own image, pinned by digest (reuse 6.2.0).
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  # Secrets and signing keys never enter the repository (docs/surec.md,
  # "Gizli bilgiler"). The pre-commit hooks catch them before a commit, but
  # they are optional and `git commit --no-verify` skips them; this job is
  # the check nobody can skip (#378). Cheap, so it runs on every change.
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The names the pre-commit hook `no-signing-secrets` refuses, in any
      # letter case.
      - name: No signing keys or key.properties are tracked
        run: |
          if git ls-files -z | grep -ziE '(^|/)key\.properties$|\.(jks|keystore|p12|pfx|pepk)$' | tr '\0' '\n' | grep .; then
            echo "::error::Signing keys and key.properties must not be committed (docs/surec.md, \"Gizli bilgiler\")."
            exit 1
          fi
      # gitleaks scans the commits this run adds: on a pull request the
      # checkout is the merge commit, whose first parent is main as it is
      # now. A manual run, or a push whose old head is unknown, scans the
      # whole history. Findings are printed redacted, never the secret.
      # The image is the release the pre-commit hook pins (gitleaks
      # v8.30.0); upgrade both together. It runs even when the step above
      # failed, so one run reports every finding.
      - name: gitleaks
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) range=HEAD^1..HEAD ;;
            push) range=$BEFORE..HEAD ;;
            merge_group) range=$MERGE_GROUP_BASE..HEAD ;;
            *) range=HEAD ;;
          esac
          if [ "$range" != HEAD ] && ! git cat-file -e "${range%..HEAD}^{commit}" 2>/dev/null; then
            range=HEAD
          fi
          echo "Scanning $range"
          docker run --rm --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --log-opts="$range" /repo

  # The required check. Skipped areas count as passed; anything failed or
  # cancelled, including the area detection, fails it.
  gate:
    name: CI
    if: always()
    needs: [changes, changelog, versions, advisories, secrets, reuse, core, android, linux, server, site, formal]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
