# CodeQL static analysis of the Rust code, the Workers and site scripts
# (JavaScript/TypeScript) and these workflows themselves. Findings go to
# the Security tab and show on the pull request. Separate from ci.yml on
# purpose: code scanning wants every pull request and main, whatever
# changed, and it is not part of the single required "CI" check.
# Dart (the Flutter app) is not a CodeQL language; the app's Kotlin needs a
# full Flutter build and is left out for now (#225).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: CodeQL reads the source without building it,
        # so no toolchain is installed and nothing from the repository runs.
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
