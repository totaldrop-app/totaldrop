# Linux desktop app: checks, and the packages (Arch, .deb, .rpm and the
# Flatpak; all but Arch also for ARM64) built separately, each in its own
# container. linux-release.yml turns them into a release from a `linux-v*`
# tag.
name: Linux

# Runs from ci.yml when its files change (see the area filters there), from
# the release workflow on a tag, or by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  check:
    name: Format, Clippy, tests
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413
    steps:
      # dbus: the single-window test runs its own session bus.
      - name: Qt 6 and the toolchain
        run: pacman -Syu --noconfirm --needed base-devel git rustup dbus qt6-base qt6-declarative qt6-wayland qt6-svg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c clippy,rustfmt
      - name: Versions agree
        run: packaging/check-versions.sh
      # The release runs check-cli-version.sh on the full history; a PR
      # checkout is shallow, so here it is tested on its own repositories
      # (with bash as /bin/sh; the scripts job below uses dash).
      - name: CLI version check works
        run: packaging/test-check-cli-version.sh
      - run: cargo fmt -p totaldrop-linux -- --check
      - run: cargo clippy -p totaldrop-linux --all-targets --locked -- -D warnings
      - run: cargo test -p totaldrop-linux --locked

  # The release scripts are POSIX sh. On Ubuntu /bin/sh is dash, so the
  # scripts the test calls run under dash too.
  scripts:
    name: Release scripts under dash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dash packaging/test-check-cli-version.sh
      - name: Package contents check works
        run: dash packaging/test-check-package-contents.sh
      - name: Flatpak crate list
        run: node --test tools/test-flatpak-cargo-sources.mjs
      # The desktop entry and the file-manager menus are written from
      # l10n/app; this also fails when they are out of date (#303).
      - name: Desktop entry and file-manager menus
        run: node --test tools/test-desktop-entries.mjs
      - name: Nautilus extension
        run: python3 -I packaging/linux/file-managers/test_totaldrop_nautilus.py

  # ARM64 (Snapdragon X, RTX Spark) on GitHub's free ARM runner, #86. Arch
  # has no official ARM64 Docker image; the PKGBUILD lists aarch64 for
  # Arch Linux ARM users to build, untested in CI.
  package:
    name: Package (${{ matrix.format }}, ${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: arch, arch: x86_64, runner: ubuntu-latest }
          - { format: deb, arch: x86_64, runner: ubuntu-latest }
          - { format: rpm, arch: x86_64, runner: ubuntu-latest }
          - { format: deb, arch: aarch64, runner: ubuntu-24.04-arm }
          - { format: rpm, arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packaging/build.sh ${{ matrix.format }}
      # The file-manager menus are in the package and Nautilus's Python
      # bindings only suggested (#319), read with the distribution's own
      # tools in the image build.sh just used.
      - name: File-manager menus in the package
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          case $FORMAT in arch) ext=pkg.tar.zst ;; *) ext=$FORMAT ;; esac
          for p in dist/packages/*."$ext"; do
            packaging/check-package-contents.sh "$p"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: totaldrop-linux-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error

  # The Flatpak (docs/kararlar/0014-steam-deck.md): the supported install on
  # SteamOS. Built from packaging/flatpak with the same Rust as above and
  # every crate fetched by flatpak-builder against Cargo.lock's checksums,
  # then installed and started inside its sandbox. The bundle goes into a release with the
  # other packages; Flathub builds its own copy from the same recipe.
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    # Flathub's own build image, with the KDE 6.11 runtime and SDK. bwrap
    # needs the privileges inside the container.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        run: packaging/check-versions.sh
      - name: Crate sources from Cargo.lock
        run: node tools/flatpak-cargo-sources.mjs write
      # Flathub's own linter, with the exceptions this app needs and why
      # (packaging/flatpak/lint-exceptions.json).
      - name: Lint the manifest
        run: >-
          flatpak-builder-lint --exceptions
          --user-exceptions packaging/flatpak/lint-exceptions.json
          manifest packaging/flatpak/app.totaldrop.TotalDrop.yml
      - name: Build
        run: >-
          flatpak-builder --disable-rofiles-fuse --install-deps-from=flathub
          --force-clean --repo=flatpak-repo flatpak-build
          packaging/flatpak/app.totaldrop.TotalDrop.yml
      - name: Bundle
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' linux/Cargo.toml | head -1)
          mkdir -p dist/packages
          flatpak build-bundle --arch=${{ matrix.arch }} \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/packages/totaldrop-$ver-${{ matrix.arch }}.flatpak" app.totaldrop.TotalDrop
      # The bundle installs and both programs start inside the sandbox, so
      # every shared library they link (Qt from the runtime among them) is
      # found. --version stops before any window or QML, so it needs no
      # display; flatpak run needs a machine id, which the container lacks.
      - name: Installs and starts in the sandbox
        run: |
          dbus-uuidgen --ensure=/etc/machine-id
          flatpak install --user -y --noninteractive dist/packages/*.flatpak
          flatpak info --user --show-permissions app.totaldrop.TotalDrop
          flatpak run --user --command=totaldrop app.totaldrop.TotalDrop --version
          QT_QPA_PLATFORM=offscreen flatpak run --user app.totaldrop.TotalDrop --version
      # The sandbox cannot add to another program's menu, so the
      # file-manager menus must stay out of the Flatpak (#319).
      - name: No file-manager menus in the Flatpak
        run: >-
          packaging/check-package-contents.sh --flatpak
          "$(flatpak info --user --show-location app.totaldrop.TotalDrop)/files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: totaldrop-linux-flatpak-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
