# Core: the protocol crates, the CLI and the Rust rendezvous server, on
# Linux, macOS and Windows. Platform apps have their own workflows.
name: Core

# Runs from ci.yml when its files change (see the area filters there), from
# the release workflow on a tag, or by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Linux desktop app needs Qt and builds in linux.yml; the Android
  # bridge builds in android.yml.
  EXCLUDE: --exclude totaldrop-linux --exclude rust_lib_totaldrop

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs exactly that version.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Only hand-written crates: app/rust/src/frb_generated.rs is generated.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check -p totaldrop-crypto -p totaldrop-proto -p totaldrop-core -p totaldrop-cli -p totaldrop-rendezvous -p totaldrop-relay
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace $EXCLUDE --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --workspace $EXCLUDE --locked

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"
