# Core: the protocol crates, the CLI and the Rust rendezvous server, on
# Linux, macOS and Windows. Platform apps have their own workflows.
name: Core

on:
  push:
    branches: [main]
    paths: &paths
      - "crates/**"
      - "server/totaldrop-rendezvous/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/core.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Linux desktop app needs Qt and builds in linux.yml; the Android
  # bridge builds in android.yml.
  EXCLUDE: --exclude totaldrop-linux --exclude rust_lib_totaldrop

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs exactly that version.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Only hand-written crates: app/rust/src/frb_generated.rs is generated.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check -p totaldrop-crypto -p totaldrop-proto -p totaldrop-core -p totaldrop-cli -p totaldrop-rendezvous
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace $EXCLUDE --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --workspace $EXCLUDE --locked

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.99.1"

# Before the first public release, pin every action above to a full commit SHA
# instead of a tag, so a compromised tag cannot change what runs here.
